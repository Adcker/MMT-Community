name: Build MMT

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Boost 1.84
        id: install-boost
        uses: MarkusJx/install-boost@v2.4.1
        with:
          boost_version: 1.84.0
          toolset: msvc
          link: static
          arch: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Patch vcxproj with Boost paths
        shell: pwsh
        run: |
          $boostRoot = "${{ steps.install-boost.outputs.BOOST_ROOT }}"
          Write-Host "BOOST_ROOT = $boostRoot"
          Get-ChildItem "$boostRoot" -Directory | ForEach-Object { Write-Host "  dir: $($_.Name)" }
          $boostLib = Get-ChildItem "$boostRoot" -Directory |
            Where-Object { $_.Name -like "lib64*" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $boostLib) { $boostLib = "$boostRoot\stage\lib" }
          Write-Host "BOOST_LIB  = $boostLib"
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '<IncludePath>(.*?)</IncludePath>', "<IncludePath>`$1;$boostRoot</IncludePath>"
            $content = $content -replace '<LibraryPath>(.*?)</LibraryPath>', "<LibraryPath>`$1;$boostLib</LibraryPath>"
            Set-Content $_.FullName $content
            Write-Host "Patched: $($_.FullName)"
          }

      - name: Build MMT.sln (Release x64)
        run: msbuild MMT.sln /p:Configuration=Release /p:Platform=x64 /m /v:m

      - name: Collect build outputs
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output -Force
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.ini |
            Where-Object { $_.FullName -match 'Release' } |
            Copy-Item -Destination output
          Get-ChildItem output

      - name: Upload artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMT-Community-x64-Release
          path: output/
          retention-days: 30
