name: Build MMT

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download Boost 1.84 (zip, no symlinks)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip" -OutFile boost.zip
          Expand-Archive boost.zip -DestinationPath .
          Write-Host "Boost extracted to $PWD\boost_1_84_0"

      - name: Build Boost (x64, static + dynamic runtime)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd boost_1_84_0
          call bootstrap.bat
          b2 toolset=msvc address-model=64 link=static runtime-link=static,shared define=_CRT_SECURE_NO_WARNINGS -j%NUMBER_OF_PROCESSORS%

      - name: Patch vcxproj with Boost paths
        shell: pwsh
        run: |
          $boostRoot = "$PWD\boost_1_84_0"
          $boostLib  = "$boostRoot\stage\lib"
          Write-Host "BOOST_ROOT = $boostRoot"
          Write-Host "BOOST_LIB  = $boostLib"
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '<IncludePath>(.*?)</IncludePath>', "<IncludePath>`$1;$boostRoot</IncludePath>"
            $content = $content -replace '<LibraryPath>(.*?)</LibraryPath>', "<LibraryPath>`$1;$boostLib</LibraryPath>"
            Set-Content $_.FullName $content
            Write-Host "Patched: $($_.FullName)"
          }

      - name: Build MMT.sln (Release x64)
        run: msbuild MMT.sln /p:Configuration=Release /p:Platform=x64 /m /v:m

      - name: Collect build outputs
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output -Force
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.ini |
            Where-Object { $_.FullName -match 'Release' } |
            Copy-Item -Destination output
          Get-ChildItem output

      - name: Upload artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMT-Community-x64-Release
          path: output/
          retention-days: 30
