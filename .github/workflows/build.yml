name: Build MMT

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC env (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Boost 1.84
        shell: pwsh
        run: |
          Invoke-WebRequest "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip" -OutFile boost.zip
          Expand-Archive boost.zip -DestinationPath .

      - name: Build Boost
        shell: cmd
        run: |
          cd boost_1_84_0
          call bootstrap.bat
          b2 toolset=msvc address-model=64 link=static,shared runtime-link=static,shared define=_CRT_SECURE_NO_WARNINGS -j%NUMBER_OF_PROCESSORS%

      - name: Cache Boost build
        uses: actions/cache@v4
        with:
          path: boost_1_84_0
          key: boost-1.84-msvc-x64

      - name: Patch vcxproj with Boost paths
        shell: pwsh
        run: |
          $boostRoot = "$PWD\boost_1_84_0"
          $boostLib  = "$boostRoot\stage\lib"
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '<IncludePath>(.*?)</IncludePath>', "<IncludePath>`$1;$boostRoot</IncludePath>"
            $content = $content -replace '<LibraryPath>(.*?)</LibraryPath>', "<LibraryPath>`$1;$boostLib</LibraryPath>"
            Set-Content $_.FullName $content
          }

      - name: Build pass 1 (generate all libs)
        run: msbuild MMT.sln /p:Configuration=Release /p:Platform=x64 /v:m /m

      - name: Build pass 2 (link exes with libs ready)
        run: msbuild MMT.sln /p:Configuration=Release /p:Platform=x64 /v:m /m

      - name: Collect build outputs
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output -Force
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.ini |
            Where-Object { $_.FullName -match 'Release' } |
            Copy-Item -Destination output
          Get-ChildItem output

      - name: Upload artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMT-Community-x64-Release
          path: output/
          retention-days: 30
